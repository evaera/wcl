[package]
name = "wcl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.81"
clap = { version = "4.5.4", features = ["derive"] }
dotenvy = "0.15.7"
env_logger = "0.11.3"
graphql_client = { version = "0.14.0", features = ["reqwest", "reqwest-crate"] }
log = "0.4.21"
reqwest = "^0.11"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread"] }
serde_path_to_error = "0.1"
serde_with = "3.7.0"
chrono = "0.4.37"
serde_repr = "0.1.18"
